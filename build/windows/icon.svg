<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Win11 强调蓝渐变 -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3AB6FF"/>
      <stop offset="0.5" stop-color="#0078D4"/>
      <stop offset="1" stop-color="#005A9E"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.08"/>
    </linearGradient>
    <clipPath id="tileClip">
      <rect x="0" y="0" width="512" height="512" rx="116" ry="116"/>
    </clipPath>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 圆角磁贴 -->
  <g clip-path="url(#tileClip)" filter="url(#softShadow)">
    <rect width="512" height="512" fill="url(#tile)"/>
    <rect width="512" height="512" fill="url(#gloss)"/>
  </g>

  <g transform="translate(256 260) rotate(-35)" fill="#FFFFFF">
    <!-- 扫帚手柄 -->
    <rect x="-22" y="-166" width="44" height="216" rx="22"/>
    <!-- 扫帚头连接环 -->
    <rect x="-32" y="46" width="64" height="40" rx="14" fill="#E6F4FF"/>
    <!-- 扫帚头主体 -->
    <rect x="-58" y="80" width="116" height="52" rx="18" fill="#FFFFFF"/>
    <!-- 刷毛：5 根下挂圆条 -->
    <rect x="-42" y="128" width="16" height="78" rx="8"/>
    <rect x="-23" y="128" width="16" height="92" rx="8"/>
    <rect x="-4"   y="128" width="16" height="98" rx="8"/>
    <rect x="15"  y="128" width="16" height="92" rx="8"/>
    <rect x="34"  y="128" width="16" height="78" rx="8"/>
  </g>

  <!-- 闪光：大星星 + 两小星 -->
  <g fill="#FFFFFF" transform="translate(0,0)">
    <path d="M 350 120 l 22 58 58 22 -58 22 -22 58 -22 -58 -58 -22 58 -22 z" opacity="0.96"/>
    <path d="M 145 155 l 13 34 34 13 -34 13 -13 34 -13 -34 -34 -13 34 -13 z" opacity="0.72"/>
    <path d="M 310 385 l 10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10 z" opacity="0.55"/>
  </g>
</svg>
