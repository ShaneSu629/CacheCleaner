name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GO111MODULE: 'on'

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: '.exe' }
          - { goos: linux,   goarch: amd64, ext: '' }
          - { goos: darwin,  goarch: amd64, ext: '' }
          - { goos: darwin,  goarch: arm64, ext: '' }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Verify module setup
        run: |
          echo "GO111MODULE=$(go env GO111MODULE)"
          echo "GOMOD=$(go env GOMOD)"
          ls -la
          test -f go.mod && echo "go.mod OK" || (echo "go.mod MISSING" && exit 1)
          head -5 go.mod

      - name: Build (static, no CGO)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          export GO111MODULE=on
          echo "--- diagnostics ---"
          go version
          go env GO111MODULE GOMOD GOPATH GOROOT
          pwd
          ls -la
          echo "--- module download ---"
          go mod download
          echo "--- building ---"
          OUT="cachecleaner-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w" -o "$OUT" ./cmd/cli
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cachecleaner-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cachecleaner-*
          if-no-files-found: error

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: cachecleaner-*

  # ── Windows GUI (Wails) ──
  build-gui:
    name: build GUI (Windows/amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build GUI
        run: wails build -skipbindings

      - name: Rename output
        shell: pwsh
        run: |
          Rename-Item -Path build\bin\CacheCleaner.exe -NewName CacheCleaner-GUI-windows-amd64.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CacheCleaner-GUI-windows-amd64
          path: build/bin/CacheCleaner-GUI-windows-amd64.exe
          if-no-files-found: error

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/CacheCleaner-GUI-windows-amd64.exe
