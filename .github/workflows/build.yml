name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GO111MODULE: 'on'

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: '.exe', runner: ubuntu-latest }
          - { goos: linux,   goarch: amd64, ext: '',     runner: ubuntu-latest }
          - { goos: darwin,  goarch: amd64, ext: '',     runner: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Verify module setup
        run: |
          echo "GO111MODULE=$(go env GO111MODULE)"
          echo "GOMOD=$(go env GOMOD)"
          ls -la
          test -f go.mod && echo "go.mod OK" || (echo "go.mod MISSING" && exit 1)
          head -5 go.mod

      - name: Build (static, no CGO)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          export GO111MODULE=on
          echo "--- diagnostics ---"
          go version
          go env GO111MODULE GOMOD GOPATH GOROOT
          pwd
          ls -la
          echo "--- module download ---"
          go mod download
          echo "--- building ---"
          OUT="cachecleaner-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w" -o "$OUT" ./cmd/cli
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cachecleaner-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cachecleaner-*
          if-no-files-found: error

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: cachecleaner-*

  # ── macOS arm64 (native, GitHub-hosted M1 runner) ──
  build-darwin-arm64:
    name: build darwin/arm64 (native)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Verify module setup
        run: |
          echo "GO111MODULE=$(go env GO111MODULE)"
          echo "GOMOD=$(go env GOMOD)"
          ls -la
          test -f go.mod && echo "go.mod OK" || (echo "go.mod MISSING" && exit 1)
          head -5 go.mod

      - name: Build (static, no CGO)
        env:
          CGO_ENABLED: '0'
        run: |
          export GO111MODULE=on
          go version
          go env GO111MODULE GOMOD GOPATH GOROOT
          go mod download
          OUT="cachecleaner-darwin-arm64"
          go build -trimpath -ldflags="-s -w" -o "$OUT" ./cmd/cli
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cachecleaner-darwin-arm64
          path: cachecleaner-darwin-arm64
          if-no-files-found: error

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: cachecleaner-darwin-arm64

  # ── Windows GUI (Wails) ──
  build-gui:
    name: build GUI (Windows/amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          # 打 tag 时用 tag 名（v1.2.0），手动触发时用 commit 短哈希
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
            $ver = "v" + $Matches[1]
          } else {
            $ver = "dev-" + $env:GITHUB_SHA.Substring(0, 7)
          }
          Write-Output "VERSION=$ver"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$ver"

      - name: Build GUI (version injected)
        run: wails build -skipbindings -ldflags "-X cachecleaner/internal/update.version=${{ steps.version.outputs.version }}"

      - name: Rename output
        shell: pwsh
        run: |
          Rename-Item -Path build\bin\CacheCleaner.exe -NewName CacheCleaner-GUI-windows-amd64.exe

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 build\bin\CacheCleaner-GUI-windows-amd64.exe).Hash.ToLower()
          "$hash  CacheCleaner-GUI-windows-amd64.exe" | Out-File -Encoding ascii build\bin\SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CacheCleaner-GUI-windows-amd64
          path: |
            build/bin/CacheCleaner-GUI-windows-amd64.exe
            build/bin/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/CacheCleaner-GUI-windows-amd64.exe
            build/bin/SHA256SUMS.txt
